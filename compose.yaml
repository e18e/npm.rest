services:
    db:
        container_name: npm-rest-db
        restart: unless-stopped
        image: postgres:18-alpine
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '127.0.0.1:${POSTGRES_PORT}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
            interval: 30s
            timeout: 8s
            retries: 6
        volumes:
            - data:/var/lib/postgresql
            - ./database/.lego/certificates/${POSTGRES_HOST}.crt:/etc/postgresql/tls/server.crt:ro
            - ./database/.lego/certificates/${POSTGRES_HOST}.key:/etc/postgresql/tls/server.key:ro

volumes:
    data:
