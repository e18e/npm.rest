packages:
    - packages/*
    - experiments/*

allowBuilds:
    esbuild: true
    sharp: true
    workerd: true

catalog:
    '@types/node': 26.4.0
    drizzle-orm: 0.45.2
    postgres: 3.4.9
    publint: 0.3.24
    typescript: 7.0.2
    valibot: 1.4.2
    wrangler: 4.127.1
    better-result: 3.0.1
    tsx: 4.23.12
    ofetch: 1.5.1

catalogs:
    log:
        '@logtape/logtape': 2.3.2
        '@logtape/drizzle-orm': 2.3.2
        '@logtape/sentry': 2.3.2
        '@sentry/node': ^10.72.0
    npm:
        hosted-git-info: 10.1.1
        '@types/hosted-git-info': 3.0.5
        npm-package-arg: 14.0.0
        '@types/npm-package-arg': 6.1.4
        semver: 7.8.5
        '@types/semver': 7.8.0
        validate-npm-package-name: 8.0.0
        '@types/validate-npm-package-name': 4.0.2

ignoreDepScripts: true

minimumReleaseAgeExclude:
    - '@rlly/pedantic@0.4.1'

patchedDependencies:
    hosted-git-info: patches/hosted-git-info.patch
    validate-npm-package-name: patches/validate-npm-package-name.patch
