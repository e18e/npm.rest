packages:
    - packages/*
    - experiments/*

allowBuilds:
    esbuild: true
    sharp: true
    workerd: true

catalog:
    '@types/node': 24.12.4
    drizzle-orm: ^0.45.1
    postgres: ^3.4.8
    publint: ^0.3.17
    typescript: 6.0.3
    valibot: ^1.2.0
    wrangler: ^4.62.0
    better-result: 2.7.0
    tsx: 4.22.3
    ofetch: ^1.5.1

catalogs:
    log:
        '@logtape/logtape': 2.1.1
        '@logtape/drizzle-orm': 2.1.1
        '@logtape/sentry': 2.1.1
        '@sentry/node': ^10.53.1
    npm:
        hosted-git-info: 10.1.1
        '@types/hosted-git-info': 3.0.5
        npm-package-arg: 14.0.0
        '@types/npm-package-arg': 6.1.4
        semver: 7.7.3
        '@types/semver': 7.7.1
        validate-npm-package-name: 8.0.0
        '@types/validate-npm-package-name': 4.0.2

ignoreDepScripts: true

minimumReleaseAgeExclude:
    - '@rlly/pedantic@0.4.1'

patchedDependencies:
    hosted-git-info: patches/hosted-git-info.patch
    validate-npm-package-name: patches/validate-npm-package-name.patch
